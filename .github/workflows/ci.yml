# CI workflow for MediaDeviceCopier.
# Note: MediaDeviceCopier.Tests.RealDevice is intentionally excluded because
# it requires physical MTP hardware and cannot run on a hosted CI runner.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediaDeviceCopier.Tests.Mocked/MediaDeviceCopier.Tests.Mocked.csproj

      - name: Build
        run: dotnet build MediaDeviceCopier.Tests.Mocked/MediaDeviceCopier.Tests.Mocked.csproj -c Release --no-restore

      - name: Test (Mocked)
        run: dotnet test MediaDeviceCopier.Tests.Mocked/MediaDeviceCopier.Tests.Mocked.csproj -c Release --no-build
